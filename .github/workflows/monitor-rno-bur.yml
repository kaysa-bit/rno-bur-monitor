name: Monitor RNO→BUR Southwest Delays

on:
  schedule:
    # every hour at minute 0 from 08:00 through 23:00 on 2026-10-16
    - cron: '0 8-23 16 10 *'
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Date to check (YYYY-MM-DD). If provided, overrides the scheduled date.'
        required: false
        default: ''
      force_run:
        description: "Set to 'true' to force checks even after the cutoff (latest departure - 2 hours)."
        required: false
        default: 'false'

jobs:
  check-delays:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dateutil

      - name: Resolve target date
        id: date
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.target_date }}" ]; then
            echo "date=${{ github.event.inputs.target_date }}" >> $GITHUB_OUTPUT
          else
            echo "date=2026-10-16" >> $GITHUB_OUTPUT
          fi

      - name: Run delay checker
        env:
          AVIATIONSTACK_KEY: ${{ secrets.AVIATIONSTACK_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TARGET_DATE: ${{ steps.date.outputs.date }}
          THRESHOLD_MINUTES: '15'
          FORCE_RUN: ${{ github.event.inputs.force_run }}
        run: python check_delays.py
